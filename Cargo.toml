[package]
name = "dterminal"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["rand_core", "aes"] }
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
base64 = "0.23.1"
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
getrandom = { version = "0.4.3", features = ["std"] }
keyring = "4.2.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssh2 = "0.9.7"
